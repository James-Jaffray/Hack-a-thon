<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/script.js"></script>
    </head>
    <body>
        <form action="https://www.google.com/search" class="searchform" method="get" name="searchform" target="_blank">
            <input name="sitesearch" type="hidden">
            <input autocomplete="on" class="form-control search" name="q" placeholder="Search in example.com" required="required"  type="text">
            <button class="button" type="submit">Search</button>
        </form>
        <div class="flex-container" id="shortcut-container">
            <!-- shortcut item template -->
            <template>
                <div class="shortcut">
                    <a href="https://google.com" target="_blank">
                        <img src="" alt="shortcut icon" class="shortcut-icon">
                    </a>
                    <p class="shortcut-name">shortcut 1</p>
                </div>
            </template>
        </div>
        <div id="calendar-calendar">
            <iframe src=”https://calendar.google.com/calendar/u/0/r” style="border:0; width:800; height:600; frameborder:0;" scrolling=”no”></iframe>
        </div>
        <!-- User preferences/dashboard -->
        <span>
            <a href="dashboard.html">
                Dashboard
            </a>
        </span>

        <header>
            <!-- Time, Date, Greeting -->
            <div>
                <h1 id="greeting"></h1>
            </div>

            <div id="date-time">
                <p id="date"></p>
                <p id="time"></p>
            </div>
        </header>

        <main>

            <section id="search">
                <!-- Google search bar -->
                 <form action="https://www.google.com/search" method="get">
                    <label for="google">Google</label>

                    <input type="search"
                        id="google"
                        name="google"
                        placeholder="Ask Google">
                    
                    <!-- Might not want -->
                    <button type="submit">Submit</button> 

                 </form>
            </section>

            <section id="weather">
                <!-- Weather information -->
                <div class="weather-header">
                    <h2>Weather</h2>
                        <p id="location"></p>
                </div>

                <div class="weather-details">
                    <p id="Precipitation"></p>
                    <p id="Humidity"></p>
                    <p id="Wind"></p>
                </div>
            </section>

            <section id="upcoming-events">
                <!-- Upcoming events - the events for today only -->
                 <div class="events-header">
                    <h2>Events Today</h2>
                 </div>

                 <div class="event-list">
                    <article class="event">
                        <div class="event-details">
                            <p id="event-date"></p>
                            <p id="event-name"></p>
                            <p id="event-time"></p>
                        </div>
                    </article>

                    <article class="event">
                        <div class="event-details">
                            <p id="event-date"></p>
                            <p id="event-name"></p>
                            <p id="event-time"></p>
                        </div>
                    </article>
                
                    <article class="event">
                        <div class="event-details">
                            <p id="event-date"></p>
                            <p id="event-name"></p>
                            <p id="event-time"></p>
                        </div>
                    </article>
                 </div>
            </section>

            <section id="calendar">
                <!-- Calendar heading -->
                <!-- Month navigation -->
                <div class="calendar-heading">
                    <h2 id="month-year"></h2>
                    <div class="calendar-nav">
                        <button id="previous-month">
                            Previous
                        </button>

                        <button id="next-month">
                            Next
                        </button>
                    </div>
                </div>

                <!-- Calendar grid -->
                <div class="days-title">
                    <div id="sunday">Sunday</div>
                    <div id="monday">Monday</div>
                    <div id="tuesday">Tuesday</div>
                    <div id="wednesday">Wednesday</div>
                    <div id="thursday">Thursday</div>
                    <div id="friday">Friday</div>
                    <div id="saturday">Saturday</div>
                </div>
            </section>
        </main>

    </body>
</html>
