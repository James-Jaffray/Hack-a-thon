        <header>
            <!-- Time, Date, Greeting -->
            <div>
                <h1 id="greeting"></h1>

        <main>

            <section id="search">
                <!-- Google search bar -->
                 <form action="https://www.google.com/search" method="get">
                    <label for="google">Google</label>

                    <input type="search"
                        id="google"
                        name="google"
                        placeholder="Ask Google">
                    
                    <!-- Might not want -->
                    <button type="submit">Submit</button> 

                 </form>
            </section>

            <section id="weather">
                <!-- Weather information -->
                <div class="weather-header">
                    <h2>Weather</h2>

                </div>

                <div class="weather-details">
                    <p id="Precipitation"></p>
                    <p id="Humidity"></p>
                    <p id="Wind"></p>
                </div>
            </section>

            <section id="upcoming-events">
                <!-- Upcoming events - the events for today only -->
                 <div class="events-header">
                    <h2>Events Today</h2>
                 </div>

                 <div class="event-list">
                    <article class="event">

                        </div>
                    </article>

                    <article class="event">

                        </div>
                    </article>
                
                    <article class="event">

                        </div>
                    </article>
                 </div>
            </section>
