<!DOCTYPE html>
<html lang="en">

<body>
    <h2>Picker test</h2>
    <div id="picker-test"></div>
    <script type="module">
        import { renderCalendarPicker } from './js/calendar-picker.js';
        import { getConnections } from './js/api.js';

        const { data } = await getConnections();
        const google = data.find(c => c.provider === 'google');
        renderCalendarPicker(document.getElementById('picker-test'), google.id, () => console.log('saved'));
    </script>
</body>

</html>
