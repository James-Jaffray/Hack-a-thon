<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalHub</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/login.js"></script>
</head>

<body>
    <main>
        <section id="auth-container">

            <header>
                <h1>CalHub</h1>
            </header>

            <!-- Filled by js/login.js when you arrive from an invite link -->
            <p id="invite-note" role="status"></p>

            <!-- Shown instead of the forms if you open an invite link while already signed in -->
            <div id="invite-join" hidden>
                <button type="button" id="join-button">Join hub</button>
                <button type="button" id="other-account-button">Use a different account</button>
            </div>

            <div id="auth-forms">
                <div class="auth-toggle">
                    <button type="button" id="login-tab">
                        Log in
                    </button>

                    <button type="button" id="signup-tab">
                        Create an account
                    </button>
                </div>

                <!-- Login form -->
                <form id="login-form">

                    <h2>Welcome back</h2>

                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" autocomplete="username" required>

                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password"
                        required>

                    <button type="submit">Log in</button>

                    <p id="login-error" role="alert"></p>

                </form>

                <!-- Signup form -->
                <form id="signup-form" hidden>

                    <h2>Create your account</h2>
                    <p>Your account is yours alone. After this you can create a hub, or join one with an invite link
                        from its owner.</p>

                    <label for="signup-name">Your name</label>
                    <input type="text" id="signup-name" name="name" maxlength="40" autocomplete="nickname" required>

                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" maxlength="254" autocomplete="username"
                        required>

                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" minlength="8" maxlength="72"
                        autocomplete="new-password" required>

                    <button type="submit">Create account</button>

                    <p id="signup-error" role="alert"></p>

                </form>

                <p><a href="/auth/google/signin">Sign in with Google</a></p>
            </div>

        </section>
    </main>
</body>

</html>
