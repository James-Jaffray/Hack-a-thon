<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalHub</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/login.js"></script>
</head>

<body>
    <main>
        <section id="auth-container">

            <header>
                <h1>CalHub</h1>
            </header>

            <div class="auth-toggle">
                <button type="button" id="login-tab">
                    Log in to a hub
                </button>

                <button type="button" id="signup-tab">
                    Create a hub
                </button>
            </div>

            <!-- Login form -->
            <form id="login-form">

                <h2>Welcome back to your hub</h2>

                <p>“Everyone sharing this hub logs in with the same hub name and password.”</p>

                <label for="login-email">Hub name</label>
                <input type="text" id="login-email" name="email" autocomplete="username" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required>

                <button type="submit">Log in to hub</button>

                <p id="login-error" role="alert"></p>

            </form>

            <!-- Signup form -->
            <form id="signup-form" hidden>

                <h2>Create a shared hub</h2>
                <p>Pick a hub name and password for your group. Everyone who joins uses them, then adds their own calendars on the dashboard.</p>

                <label for="signup-email">Hub name</label>
                <input type="text" id="signup-email" name="email" minlength="3" maxlength="40" autocomplete="username"
                    required>

                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="password" minlength="8" maxlength="72" required>

                <button type="submit">Create hub</button>

                <p id="signup-error" role="alert"></p>

            </form>

        </section>
    </main>
</body>

</html>
