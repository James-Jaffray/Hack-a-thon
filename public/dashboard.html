<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/connections.js"></script>
</head>

<body>
    <nav class="dashboard-nav">
        <a href="index.html">Back to Main Page</a>
        <button type="button" id="logout-button">
            Log out
        </button>
    </nav>

    <main class="dashboard-container">
        <section>
            <h2>Themes</h2>
        </section>

        <hr>

        <section>
            <h2>Shortcuts</h2>
        </section>

        <hr>

        <section id="calendar-connections">
            <h2>Calendar Connections</h2>

            <div>
                <h3>Google Calendar</h3>
                <p>Connect securely using your Google account.</p>

                <label for="google-owner">Whose calendar is this?</label>
                <input type="text" id="google-owner" placeholder="e.g. Althea" maxlength="40">
                <button type="button" id="google-connect">Connect Google Calendar</button>
            </div>

            <hr>

            <div>
                <h3>Apple Calendar</h3>
                <p>Add an Apple Calendar using its public sharing URL.</p>

                <form id="apple-calendar-form">
                    <div>
                        <label for="apple-calendar-name">
                            Calendar Name
                        </label>
                        <input type="text" id="apple-calendar-name" placeholder="My Apple Calendar">
                    </div>

                    <div>
                        <label for="apple-calendar-owner">Whose calendar is this?</label>
                        <input type="text" id="apple-calendar-owner" placeholder="e.g. Caleb" maxlength="40">
                    </div>

                    <div>
                        <label for="apple-calendar-url">
                            Apple Calendar Public Sharing URL
                        </label>
                        <input type="url" id="apple-calendar-url" placeholder="Paste Your Apple Calendar Sharing Link"
                            required>
                    </div>

                    <button type="submit">
                        Add Apple Calendar
                    </button>

                    <p id="apple-calendar-error" role="alert"></p>
                    <p id="apple-calendar-success" role="status"></p>
                </form>
            </div>

            <hr>

            <div>
                <h3>Connected Calendars</h3>
                <ul id="connected-calendars"></ul>
            </div>
        </section>

        <hr>
    </main>
</body>

</html>
