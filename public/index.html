<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/calendar.css">
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/calendar.js"></script>
    <script type="module" src="js/hub-bar.js"></script>
</head>

<body>
    <!-- User preferences/dashboard -->
    <span>
        <a href="dashboard.html">
            Dashboard
        </a>
        Hub: <strong class="hub-name"></strong>
        <button type="button" class="switch-hub">Switch hub</button>
    </span>

    <header>
        <!-- Time, Date, Greeting -->
        <div>
            <h1 id="greeting"></h1>
        </div>
        <div class="flex-container" id="shortcut-container">
            <!-- shortcut item template -->
            <template>
                <div class="shortcut">
                    <a href="https://google.com" target="_blank">
                        <img src="" alt="shortcut icon" class="shortcut-icon">
                    </a>
                    <p class="shortcut-name">shortcut 1</p>
                </div>
            </template>
        </div>

        <div id="date-time">
            <p id="date"></p>
            <p id="time"></p>
        </div>
    </header>

    <main>

        <section id="search">
            <form action="https://www.google.com/search" class="searchform" method="get" name="searchform" target="_blank">
            <input name="sitesearch" type="hidden">
            <input autocomplete="on" class="form-control search" name="q" placeholder="Search in example.com" required="required"  type="text">
            <button class="button" type="submit">Search</button>
        </form>
        </section>

        <section id="weather">
            <!-- Weather information -->
            <div class="weather-header">
                <h2>Weather</h2>
                <p id="location"></p>
            </div>

            <div class="weather-details">
                <p id="Tempature"></p>
                <p id="feels-like"></p>
                <p id="Condition"></p>
                <p id="Precipitation"></p>
                <p id="Humidity"></p>
                <p id="Wind"></p>
            </div>
        </section>

        <section id="upcoming-events">
            <!-- Upcoming events - the events for today only -->
            <div class="events-header">
                <h2>Events Today</h2>
            </div>

            <div class="event-list">
                <article class="event">
                    <div class="event-details">
                        <p id="event-date"></p>
                        <p id="event-name"></p>
                        <p id="event-time"></p>
                    </div>
                </article>
            </div>
        </section>

        <section id="calendar">
            <!-- Calendar heading -->
            <!-- Month navigation -->
            <div class="calendar-heading">
                <h2 id="month-year"></h2>
                <div class="calendar-nav">
                    <button id="previous-month">
                        Previous
                    </button>

                    <button id="next-month">
                        Next
                    </button>
                </div>
            </div>

            <!-- Calendar grid -->
            <div class="days-title">
                <div id="sunday">Sunday</div>
                <div id="monday">Monday</div>
                <div id="tuesday">Tuesday</div>
                <div id="wednesday">Wednesday</div>
                <div id="thursday">Thursday</div>
                <div id="friday">Friday</div>
                <div id="saturday">Saturday</div>
            </div>
        </section>
    </main>

</body>

</html>
