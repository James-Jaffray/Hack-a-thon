<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalHub</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/calendar.css">
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/calendar.js"></script>
    <script type="module" src="js/hub-bar.js"></script>
</head>

<body class="home">
    <div class="band">
    <nav class="top-bar">
        <h1>CalHub</h1>
        <a href="dashboard.html">Dashboard</a>
        <span class="hub-label">Hub</span>
        <strong class="hub-name"></strong>
        <button type="button" class="switch-hub">Switch hub</button>
    </nav>

    <header>
        <div id="date-time">
            <p id="date"></p>
            <p id="time"></p>
        </div>

        <div class="flex-container" id="shortcut-container"></div>
    </header>
    </div>

    <main class="home-grid">

        <section id="search">
            <form action="https://www.google.com/search" class="searchform" method="get" name="searchform"
                target="_blank">
                <input name="sitesearch" type="hidden">
                <input autocomplete="on" class="form-control search" name="q" placeholder="Search Google" aria-label="Search Google"
                    required="required" type="text">
                <button class="button" type="submit">Search</button>
            </form>
        </section>

        <section id="weather">
            <!-- Weather information -->
            <div class="weather-header">
                <h2>Weather</h2>
                <p id="location"></p>
            </div>

            <div class="weather-details">
                <p id="Tempature"></p>
                <p id="feels-like"></p>
                <p id="Condition"></p>
                <p id="Precipitation"></p>
                <p id="Humidity"></p>
                <p id="Wind"></p>
            </div>
        </section>

        <section id="upcoming-events">
            <!-- Upcoming events - the events for today only -->
            <div class="events-header">
                <h2>Today</h2>
            </div>

            <div class="event-list">
                <article class="event">
                    <div class="event-details">
                        <p id="event-date"></p>
                        <p id="event-name"></p>
                        <p id="event-time"></p>
                    </div>
                </article>
            </div>
        </section>

        <section id="calendar">
            <!-- Calendar heading -->
            <!-- Month navigation -->
            <div class="calendar-heading">
                <h2 id="month-year"></h2>
                <div class="calendar-nav">
                    <button id="previous-month" class="icon-button" aria-label="Previous month">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                    </button>

                    <button id="next-month" class="icon-button" aria-label="Next month">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>

            <!-- Calendar grid -->
            <div class="days-title">
                <div id="sunday">Sun</div>
                <div id="monday">Mon</div>
                <div id="tuesday">Tue</div>
                <div id="wednesday">Wed</div>
                <div id="thursday">Thu</div>
                <div id="friday">Fri</div>
                <div id="saturday">Sat</div>
            </div>
        </section>
    </main>

</body>

</html>
